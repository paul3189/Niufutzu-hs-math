<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Hiragino Sans',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">符號表：f(x) = (x − 1)(x − 2)²(x − 4)</text>
  <text x="280" y="56" text-anchor="middle" font-size="13" fill="#64748b">從最右上方出發，奇數重根「穿過」、偶數重根「碰一下就彈回」</text>

  <line x1="55" y1="200" x2="525" y2="200" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="525,200 515,195 515,205" fill="#94a3b8"/>

  <path d="M70,145 C105,150 130,175 150,200 C180,255 235,200 260,200 C285,200 320,250 350,250 C390,250 410,230 430,200 C455,172 482,152 510,125"
        fill="none" stroke="#dc2626" stroke-width="2.6"/>

  <g stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="150" y1="200" x2="150" y2="278"/>
    <line x1="260" y1="200" x2="260" y2="278"/>
    <line x1="430" y1="200" x2="430" y2="278"/>
  </g>
  <circle cx="150" cy="200" r="5" fill="#dc2626"/>
  <circle cx="260" cy="200" r="5" fill="#dc2626"/>
  <circle cx="430" cy="200" r="5" fill="#dc2626"/>

  <g font-size="14" fill="#1f2937" text-anchor="middle">
    <text x="150" y="298">1</text>
    <text x="260" y="298">2</text>
    <text x="430" y="298">4</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="150" y="315">單根</text>
    <text x="260" y="315">二重根</text>
    <text x="430" y="315">單根</text>
  </g>

  <g font-size="20" font-weight="700" text-anchor="middle">
    <text x="105" y="178" fill="#b91c1c">＋</text>
    <text x="205" y="240" fill="#1d4ed8">−</text>
    <text x="345" y="235" fill="#1d4ed8">−</text>
    <text x="475" y="172" fill="#b91c1c">＋</text>
  </g>

  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#64748b">f(x) &gt; 0 取「＋」的區間；x = 2 處只碰不穿，兩側同號</text>
</svg>
