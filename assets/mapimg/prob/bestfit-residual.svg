<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#111">最適直線：讓「上下差距」的平方和最小的那一條</text>

  <line x1="70" y1="280" x2="500" y2="280" stroke="#555" stroke-width="1.5"/>
  <line x1="70" y1="280" x2="70"  y2="55"  stroke="#555" stroke-width="1.5"/>
  <text x="505" y="285" font-size="13" fill="#555">x</text>
  <text x="56"  y="52"  font-size="13" fill="#555">y</text>

  <!-- 最適直線 -->
  <line x1="90" y1="248" x2="480" y2="92" stroke="#4f46e5" stroke-width="2.2"/>
  <text x="398" y="104" font-size="14" fill="#4f46e5">最適直線</text>

  <!-- 資料點與殘差（垂直線段） -->
  <line x1="130" y1="232" x2="130" y2="200" stroke="#f43f5e" stroke-width="1.6"/>
  <circle cx="130" cy="200" r="5" fill="#111"/>
  <line x1="190" y1="208" x2="190" y2="238" stroke="#f43f5e" stroke-width="1.6"/>
  <circle cx="190" cy="238" r="5" fill="#111"/>
  <line x1="250" y1="184" x2="250" y2="160" stroke="#f43f5e" stroke-width="1.6"/>
  <circle cx="250" cy="160" r="5" fill="#111"/>
  <line x1="310" y1="160" x2="310" y2="186" stroke="#f43f5e" stroke-width="1.6"/>
  <circle cx="310" cy="186" r="5" fill="#111"/>
  <line x1="370" y1="136" x2="370" y2="112" stroke="#f43f5e" stroke-width="1.6"/>
  <circle cx="370" cy="112" r="5" fill="#111"/>
  <line x1="430" y1="112" x2="430" y2="136" stroke="#f43f5e" stroke-width="1.6"/>
  <circle cx="430" cy="136" r="5" fill="#111"/>

  <text x="140" y="196" font-size="13" fill="#f43f5e">差距</text>
  <text x="200" y="250" font-size="13" fill="#f43f5e">差距</text>

  <!-- 平均點 -->
  <circle cx="285" cy="170" r="7" fill="none" stroke="#4f46e5" stroke-width="2.4"/>
  <line x1="289" y1="176" x2="308" y2="226" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="300" y="244" font-size="13" fill="#4f46e5">( x 的平均 , y 的平均 )</text>

  <text x="70" y="312" font-size="14" fill="#111">直線一定通過「兩組平均數」那一點；斜率的正負與 r 的正負一致</text>
  <text x="70" y="332" font-size="14" fill="#333">超出資料範圍的預測（外插）不可靠；相關 ≠ 因果</text>
</svg>
