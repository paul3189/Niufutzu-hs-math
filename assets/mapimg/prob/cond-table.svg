<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#111">條件機率：分母換成「已知的那一格」</text>
  <text x="280" y="52" text-anchor="middle" font-size="14" fill="#555">1000 人做篩檢（表中是人數）</text>

  <!-- 表格 -->
  <rect x="80" y="70" width="400" height="150" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="80"  y1="110" x2="480" y2="110" stroke="#333" stroke-width="1.5"/>
  <line x1="80"  y1="150" x2="480" y2="150" stroke="#333" stroke-width="1"/>
  <line x1="80"  y1="190" x2="480" y2="190" stroke="#333" stroke-width="1"/>
  <line x1="200" y1="70"  x2="200" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="70"  x2="300" y2="220" stroke="#333" stroke-width="1"/>
  <line x1="400" y1="70"  x2="400" y2="220" stroke="#333" stroke-width="1"/>

  <!-- 反白：陽性這一直行 -->
  <rect x="200" y="110" width="100" height="80" fill="#c7d2fe" fill-opacity="0.6"/>

  <text x="140" y="96"  text-anchor="middle" font-size="14" fill="#111"></text>
  <text x="250" y="96"  text-anchor="middle" font-size="14" fill="#111">檢驗陽性</text>
  <text x="350" y="96"  text-anchor="middle" font-size="14" fill="#111">檢驗陰性</text>
  <text x="440" y="96"  text-anchor="middle" font-size="14" fill="#111">合計</text>

  <text x="140" y="136" text-anchor="middle" font-size="14" fill="#111">真的有病</text>
  <text x="250" y="136" text-anchor="middle" font-size="15" fill="#4f46e5">18</text>
  <text x="350" y="136" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="440" y="136" text-anchor="middle" font-size="14" fill="#333">20</text>

  <text x="140" y="176" text-anchor="middle" font-size="14" fill="#111">其實沒病</text>
  <text x="250" y="176" text-anchor="middle" font-size="15" fill="#4f46e5">98</text>
  <text x="350" y="176" text-anchor="middle" font-size="14" fill="#333">882</text>
  <text x="440" y="176" text-anchor="middle" font-size="14" fill="#333">980</text>

  <text x="140" y="212" text-anchor="middle" font-size="14" fill="#111">合計</text>
  <text x="250" y="212" text-anchor="middle" font-size="15" fill="#4f46e5">116</text>
  <text x="350" y="212" text-anchor="middle" font-size="14" fill="#333">884</text>
  <text x="440" y="212" text-anchor="middle" font-size="14" fill="#333">1000</text>

  <!-- 說明 -->
  <line x1="250" y1="228" x2="250" y2="248" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="250" y="266" text-anchor="middle" font-size="14" fill="#4f46e5">已知「檢驗陽性」⇒ 樣本空間縮小成這一行</text>

  <text x="60" y="300" font-size="16" fill="#111">P(有病) = 20 / 1000 = 2%</text>
  <text x="60" y="326" font-size="16" fill="#4f46e5">P(有病 | 陽性) = 18 / 116 ≈ 15.5%　（分母不是 1000，是 116）</text>
</svg>
