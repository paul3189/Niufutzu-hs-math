<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="40" y="40" font-size="15" font-weight="bold" fill="#6d28d9">向量的加、減與分點</text>

  <!-- 加法：三角形法 ＋ 平行四邊形法 -->
  <line x1="60" y1="160" x2="115" y2="105" stroke="#c4b5fd" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="115" y1="105" x2="205" y2="75" stroke="#c4b5fd" stroke-width="1.6" stroke-dasharray="4 3"/>

  <line x1="60" y1="160" x2="150" y2="130" stroke="#7c3aed" stroke-width="2.4"/>
  <polygon points="152,129.3 141,127.5 144,136" fill="#7c3aed"/>
  <line x1="150" y1="130" x2="205" y2="75" stroke="#0891b2" stroke-width="2.4"/>
  <polygon points="206.5,73.5 196,76 204,84" fill="#0891b2"/>
  <line x1="60" y1="160" x2="205" y2="75" stroke="#d97706" stroke-width="2.6"/>
  <polygon points="206.5,74 195.5,76 200,84.5" fill="#d97706"/>

  <text x="100" y="156" font-size="14" fill="#6d28d9">a</text>
  <text x="182" y="112" font-size="14" fill="#0e7490">b</text>
  <text x="112" y="96" font-size="14" fill="#b45309">a + b</text>
  <circle cx="60" cy="160" r="3.5" fill="#374151"/>
  <text x="46" y="174" font-size="12" fill="#374151">O</text>
  <text x="40" y="196" font-size="11.5" fill="#4b5563">三角形法：頭接尾　平行四邊形法：同起點</text>

  <!-- 減法 -->
  <line x1="330" y1="165" x2="370" y2="80" stroke="#7c3aed" stroke-width="2.4"/>
  <polygon points="371,78 361,82.5 368.5,86" fill="#7c3aed"/>
  <line x1="330" y1="165" x2="470" y2="120" stroke="#0891b2" stroke-width="2.4"/>
  <polygon points="472,119.4 461.5,116.5 463.5,125" fill="#0891b2"/>
  <line x1="370" y1="80" x2="470" y2="120" stroke="#d97706" stroke-width="2.6"/>
  <polygon points="472,120.8 461,118 463,126.5" fill="#d97706"/>
  <circle cx="330" cy="165" r="3.5" fill="#374151"/>
  <text x="316" y="178" font-size="12" fill="#374151">O</text>
  <text x="364" y="72" font-size="12" fill="#374151">A</text>
  <text x="476" y="118" font-size="12" fill="#374151">B</text>
  <text x="332" y="112" font-size="13" fill="#6d28d9">OA</text>
  <text x="404" y="160" font-size="13" fill="#0e7490">OB</text>
  <text x="408" y="88" font-size="13" fill="#b45309">AB</text>
  <text x="318" y="196" font-size="11.5" fill="#4b5563">AB = OB − OA（終點減起點，別寫反）</text>

  <line x1="40" y1="216" x2="520" y2="216" stroke="#e5e7eb" stroke-width="1.2"/>

  <!-- 分點 -->
  <line x1="60" y1="272" x2="360" y2="272" stroke="#7c3aed" stroke-width="2.6"/>
  <circle cx="60" cy="272" r="5" fill="#7c3aed"/>
  <circle cx="260" cy="272" r="5" fill="#d97706"/>
  <circle cx="360" cy="272" r="5" fill="#7c3aed"/>
  <text x="52" y="294" font-size="13" fill="#374151">A</text>
  <text x="254" y="294" font-size="13" fill="#b45309">P</text>
  <text x="356" y="294" font-size="13" fill="#374151">B</text>
  <line x1="60" y1="252" x2="260" y2="252" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="260" y1="252" x2="360" y2="252" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="60" y1="247" x2="60" y2="257" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="260" y1="247" x2="260" y2="257" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="360" y1="247" x2="360" y2="257" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="160" y="244" font-size="13" fill="#4b5563" text-anchor="middle">m</text>
  <text x="310" y="244" font-size="13" fill="#4b5563" text-anchor="middle">n</text>

  <text x="390" y="250" font-size="12.5" fill="#b45309">係數是「交叉」的：</text>
  <text x="390" y="272" font-size="12" fill="#4b5563">m（AP 那一段）乘在 B 上</text>
  <text x="390" y="292" font-size="12" fill="#4b5563">外分點把其中一個取負號</text>

  <text x="40" y="326" font-size="13" fill="#1f2937">AP : PB = m : n　⇒　P = (n · A + m · B) ÷ (m + n)</text>
</svg>
