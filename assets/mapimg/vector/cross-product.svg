<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="40" y="44" font-size="15" font-weight="bold" fill="#6d28d9">外積：方向垂直、長度＝平行四邊形面積</text>

  <!-- 平行四邊形 -->
  <polygon points="150,215 290,240 380,185 240,160" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="272" y="208" font-size="13" fill="#6d28d9" text-anchor="middle">面積 = |a × b|</text>

  <!-- a -->
  <line x1="150" y1="215" x2="290" y2="240" stroke="#7c3aed" stroke-width="2.8"/>
  <polygon points="292,240.4 281.5,236 280,244.5" fill="#7c3aed"/>
  <text x="212" y="242" font-size="14" fill="#6d28d9">a</text>
  <!-- b -->
  <line x1="150" y1="215" x2="240" y2="160" stroke="#0891b2" stroke-width="2.8"/>
  <polygon points="241.5,159 231,160 235,168" fill="#0891b2"/>
  <text x="182" y="178" font-size="14" fill="#0e7490">b</text>

  <!-- a x b -->
  <line x1="150" y1="215" x2="150" y2="82" stroke="#d97706" stroke-width="3"/>
  <polygon points="150,78 145,90 155,90" fill="#d97706"/>
  <text x="158" y="92" font-size="14" fill="#b45309">a × b</text>
  <polyline points="150,105 163,105 163,118" fill="none" stroke="#d97706" stroke-width="1.2"/>

  <!-- 角 -->
  <path d="M 191.4 222.4 A 42 42 0 0 0 185.8 193.1" fill="none" stroke="#6b7280" stroke-width="1.4"/>
  <text x="196" y="210" font-size="13" fill="#4b5563">θ</text>

  <circle cx="150" cy="215" r="3.5" fill="#374151"/>

  <text x="408" y="120" font-size="12.5" fill="#b45309">右手法則：</text>
  <text x="408" y="142" font-size="11.5" fill="#4b5563">四指由 a 轉向 b，</text>
  <text x="408" y="162" font-size="11.5" fill="#4b5563">拇指就是 a × b</text>
  <text x="408" y="192" font-size="11.5" fill="#4b5563">b × a 方向相反</text>

  <text x="40" y="284" font-size="12.5" fill="#1f2937">|a × b| = |a| |b| sin θ = 平行四邊形面積　→　三角形面積要再除以 2</text>
  <text x="40" y="306" font-size="12.5" fill="#1f2937">a × b 同時垂直於 a 與 b（常拿來當法向量）；a × b = −(b × a)，不可交換</text>
  <text x="40" y="328" font-size="12.5" fill="#4b5563">a × b = (a₂b₃ − a₃b₂, a₃b₁ − a₁b₃, a₁b₂ − a₂b₁)；兩向量平行時為零向量</text>
</svg>
