<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="40" y="44" font-size="15" font-weight="bold" fill="#6d28d9">平面的法向量與點到平面的距離</text>

  <!-- 平面 -->
  <polygon points="80,250 340,250 440,180 180,180" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="96" y="242" font-size="12.5" fill="#6d28d9">E : ax + by + cz + d₀ = 0</text>

  <!-- 法向量 -->
  <circle cx="200" cy="218" r="3.5" fill="#7c3aed"/>
  <line x1="200" y1="218" x2="200" y2="126" stroke="#7c3aed" stroke-width="2.8"/>
  <polygon points="200,122 195,134 205,134" fill="#7c3aed"/>
  <text x="208" y="132" font-size="13" fill="#6d28d9">n = (a, b, c)</text>
  <polyline points="200,208 212,208 212,196" fill="none" stroke="#7c3aed" stroke-width="1.2"/>

  <!-- 點 P 與距離 -->
  <circle cx="330" cy="100" r="5" fill="#d97706"/>
  <text x="340" y="96" font-size="13" fill="#b45309">P(x₀, y₀, z₀)</text>
  <line x1="330" y1="100" x2="330" y2="207" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 4"/>
  <circle cx="330" cy="207" r="4" fill="#d97706"/>
  <text x="338" y="158" font-size="15" fill="#b45309">d</text>
  <polyline points="330,197 342,197 342,185" fill="none" stroke="#d97706" stroke-width="1.2"/>
  <text x="300" y="226" font-size="11.5" fill="#b45309">垂足</text>

  <text x="40" y="286" font-size="15" fill="#1f2937">d = |a x₀ + b y₀ + c z₀ + d₀| ÷ √(a² + b² + c²)</text>
  <text x="40" y="310" font-size="12" fill="#4b5563">與平面上「點到直線」的公式同構，只是多了一個 z；法向量不可為零向量</text>
  <text x="40" y="330" font-size="12" fill="#4b5563">兩平行平面的距離：先把 a、b、c 化成一致，再取 |d₁ − d₂| ÷ √(a² + b² + c²)</text>
</svg>
