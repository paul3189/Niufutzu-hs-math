<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Hiragino Sans',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">指數與對數互為反函數：兩張圖對 y = x 對稱</text>

  <!-- 坐標軸：原點 (170,230)，每單位 34px -->
  <line x1="70" y1="230" x2="500" y2="230" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="500,230 490,225 490,235" fill="#94a3b8"/>
  <line x1="170" y1="310" x2="170" y2="45" stroke="#94a3b8" stroke-width="1.6"/>
  <polygon points="170,45 165,55 175,55" fill="#94a3b8"/>
  <text x="507" y="234" font-size="13" fill="#475569">x</text>
  <text x="158" y="45" font-size="13" fill="#475569">y</text>

  <!-- y = x -->
  <line x1="110" y1="290" x2="350" y2="50" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="354" y="56" font-size="12" fill="#64748b">y = x</text>

  <!-- y = a^x -->
  <polyline points="102,221.5 119,218 136,213 153,206 170,196 187,182 204,162 221,134 238,94 248,62.5"
            fill="none" stroke="#059669" stroke-width="2.6"/>
  <text x="256" y="76" font-size="13" fill="#047857">y = aˣ　(a &gt; 1)</text>

  <!-- y = log_a x -->
  <polyline points="178.5,298 182,281 187,264 194,247 204,230 218,213 238,196 266,179 306,162 337.5,151.8"
            fill="none" stroke="#0d9488" stroke-width="2.6"/>
  <text x="345" y="148" font-size="13" fill="#0f766e">y = logₐ x</text>

  <circle cx="170" cy="196" r="5" fill="#047857"/>
  <circle cx="204" cy="230" r="5" fill="#0f766e"/>
  <text x="163" y="188" text-anchor="end" font-size="12" fill="#1f2937">(0, 1)</text>
  <text x="212" y="248" font-size="12" fill="#1f2937">(1, 0)</text>

  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#64748b">y = aˣ 值域恆為 y &gt; 0，漸近線 y = 0；y = logₐ x 定義域為 x &gt; 0，漸近線 x = 0</text>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#64748b">0 &lt; a &lt; 1 時兩張圖都改成遞減，指對不等式要變號</text>
</svg>
