<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Hiragino Sans',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">對 x 動手腳＝左右（方向相反）；對 y 動手腳＝上下（方向相同）</text>

  <!-- 左：平移 -->
  <line x1="45" y1="240" x2="275" y2="240" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="100" y1="265" x2="100" y2="105" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M70,180 Q100,300 130,180" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M130,135 Q160,255 190,135" fill="none" stroke="#059669" stroke-width="2.6"/>
  <circle cx="100" cy="240" r="4.5" fill="#94a3b8"/>
  <circle cx="160" cy="195" r="4.5" fill="#047857"/>
  <line x1="100" y1="240" x2="154" y2="199" stroke="#047857" stroke-width="1.6"/>
  <polygon points="160,195 147,196 153,206" fill="#047857"/>
  <text x="150" y="255" font-size="12" fill="#047857">右 h</text>
  <text x="196" y="196" font-size="12" fill="#047857">上 k</text>
  <text x="62" y="170" font-size="11" fill="#64748b">f(x)</text>
  <text x="196" y="132" font-size="11" fill="#047857">f(x − h) + k</text>
  <text x="160" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">平移</text>
  <text x="160" y="314" text-anchor="middle" font-size="12" fill="#475569">括號內是 x − h 才是右移 h</text>
  <text x="160" y="332" text-anchor="middle" font-size="12" fill="#475569">x + 2 是左移 2</text>

  <line x1="290" y1="95" x2="290" y2="270" stroke="#e2e8f0" stroke-width="1.4"/>

  <!-- 右：對稱 -->
  <line x1="310" y1="210" x2="540" y2="210" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="425" y1="285" x2="425" y2="110" stroke="#94a3b8" stroke-width="1.4"/>
  <path d="M425,210 Q468,212 485,165 Q497,140 508,128" fill="none" stroke="#059669" stroke-width="2.6"/>
  <path d="M425,210 Q382,212 365,165 Q353,140 342,128" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M425,210 Q468,208 485,255 Q497,280 508,292" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="512" y="124" font-size="11" fill="#047857">f(x)</text>
  <text x="316" y="124" font-size="11" fill="#047857">f(−x)</text>
  <text x="512" y="298" font-size="11" fill="#047857">−f(x)</text>
  <text x="425" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">對稱</text>
  <text x="425" y="314" text-anchor="middle" font-size="12" fill="#475569">f(−x) 對 y 軸、−f(x) 對 x 軸</text>
  <text x="425" y="332" text-anchor="middle" font-size="12" fill="#475569">對 y = x 對稱要換成反函數</text>

  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#64748b">伸縮：y = a f(bx) → y 方向拉 a 倍、x 方向縮 1/|b| 倍（週期變成 1/|b|）</text>
</svg>
