<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Hiragino Sans',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">限制區間的最值：先看對稱軸在不在區間裡</text>

  <!-- 左：對稱軸在區間內 -->
  <rect x="110" y="70" width="110" height="200" fill="#059669" opacity="0.10"/>
  <path d="M50,100 Q150,380 250,100" fill="none" stroke="#059669" stroke-width="2.6"/>
  <line x1="150" y1="70" x2="150" y2="278" stroke="#6ee7b7" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="40" y1="270" x2="265" y2="270" stroke="#94a3b8" stroke-width="1.4"/>
  <circle cx="110" cy="218" r="5" fill="#047857"/>
  <circle cx="150" cy="240" r="5.5" fill="#047857"/>
  <circle cx="220" cy="171" r="5" fill="#047857"/>
  <text x="150" y="262" text-anchor="middle" font-size="12" fill="#047857">最小（頂點）</text>
  <text x="228" y="162" font-size="12" fill="#047857">最大</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="110" y="288">a</text>
    <text x="220" y="288">b</text>
  </g>
  <text x="150" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">對稱軸落在區間內</text>
  <text x="150" y="328" text-anchor="middle" font-size="12" fill="#475569">頂點 ＋ 較遠的那個端點</text>

  <!-- 右：對稱軸在區間外 -->
  <rect x="430" y="70" width="50" height="200" fill="#059669" opacity="0.10"/>
  <path d="M310,90 Q400,380 490,90" fill="none" stroke="#059669" stroke-width="2.6"/>
  <line x1="400" y1="70" x2="400" y2="278" stroke="#6ee7b7" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="300" y1="270" x2="515" y2="270" stroke="#94a3b8" stroke-width="1.4"/>
  <circle cx="430" cy="219" r="5" fill="#047857"/>
  <circle cx="480" cy="121" r="5" fill="#047857"/>
  <text x="418" y="240" text-anchor="middle" font-size="12" fill="#047857">最小</text>
  <text x="490" y="116" font-size="12" fill="#047857">最大</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="430" y="288">a</text>
    <text x="480" y="288">b</text>
  </g>
  <text x="400" y="309" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">對稱軸落在區間外</text>
  <text x="400" y="328" text-anchor="middle" font-size="12" fill="#475569">函數單調，兩個端點就是最值</text>

  <text x="400" y="62" text-anchor="middle" font-size="12" fill="#64748b">對稱軸</text>
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#64748b">對稱軸</text>
</svg>
