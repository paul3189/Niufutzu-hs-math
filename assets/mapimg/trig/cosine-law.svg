<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <polygon points="70,255 300,255 185,100" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="2.4"/>

  <!-- 夾角 A -->
  <path d="M 110 255 A 40 40 0 0 0 99.6 228.1" fill="none" stroke="#b45309" stroke-width="1.8"/>
  <text x="90" y="244" font-size="14" fill="#b45309">A</text>

  <circle cx="70" cy="255" r="4" fill="#d97706"/>
  <circle cx="300" cy="255" r="4" fill="#d97706"/>
  <circle cx="185" cy="100" r="4" fill="#d97706"/>
  <text x="58" y="278" font-size="15" fill="#92400e">A</text>
  <text x="304" y="278" font-size="15" fill="#92400e">B</text>
  <text x="180" y="90" font-size="15" fill="#92400e">C</text>

  <!-- 邊 -->
  <text x="180" y="278" font-size="15" fill="#0e7490">c</text>
  <text x="254" y="180" font-size="15" fill="#0e7490">a</text>
  <text x="114" y="180" font-size="15" fill="#0e7490">b</text>

  <text x="46" y="330" font-size="12.5" fill="#4b5563">2bc 的 b、c 就是「夾住 ∠A」的那兩邊；a 是 A 的對邊</text>

  <!-- 右側 -->
  <text x="330" y="74" font-size="15" font-weight="bold" fill="#b45309">餘弦定理</text>
  <text x="330" y="106" font-size="13.5" fill="#1f2937">a² = b² + c² − 2bc · cos A</text>
  <text x="330" y="132" font-size="13.5" fill="#1f2937">b² = c² + a² − 2ca · cos B</text>
  <text x="330" y="158" font-size="13.5" fill="#1f2937">c² = a² + b² − 2ab · cos C</text>

  <line x1="330" y1="176" x2="530" y2="176" stroke="#e5e7eb" stroke-width="1.2"/>

  <text x="330" y="202" font-size="12.5" fill="#1f2937">兩邊夾角（SAS）→ 求第三邊</text>
  <text x="330" y="228" font-size="12.5" fill="#1f2937">三邊（SSS）→ 求角：</text>
  <text x="348" y="252" font-size="13" fill="#0e7490">cos A = (b² + c² − a²) ÷ 2bc</text>
  <text x="330" y="284" font-size="12.5" fill="#4b5563">cos A &gt; 0 銳角　= 0 直角</text>
  <text x="330" y="304" font-size="12.5" fill="#4b5563">cos A &lt; 0 鈍角（沒有模糊情況）</text>
</svg>
