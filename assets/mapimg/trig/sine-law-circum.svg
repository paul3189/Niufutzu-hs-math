<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <!-- 外接圓 -->
  <circle cx="185" cy="180" r="105" fill="none" stroke="#0891b2" stroke-width="1.6" stroke-dasharray="5 4"/>

  <!-- 三角形 -->
  <polygon points="149.1,81.3 94.1,232.5 283.7,215.9" fill="#fef3c7" fill-opacity="0.6" stroke="#d97706" stroke-width="2.2"/>

  <!-- 圓心與半徑 -->
  <line x1="185" y1="180" x2="283.7" y2="215.9" stroke="#0891b2" stroke-width="1.6"/>
  <circle cx="185" cy="180" r="3.5" fill="#0891b2"/>
  <text x="166" y="176" font-size="13" fill="#0e7490">O</text>
  <text x="228" y="212" font-size="13" fill="#0e7490">R</text>

  <!-- 頂點 -->
  <text x="140" y="71" font-size="15" fill="#b45309">A</text>
  <text x="74" y="246" font-size="15" fill="#b45309">B</text>
  <text x="292" y="224" font-size="15" fill="#b45309">C</text>

  <!-- 邊 -->
  <text x="184" y="248" font-size="14" fill="#92400e">a</text>
  <text x="228" y="144" font-size="14" fill="#92400e">b</text>
  <text x="98" y="150" font-size="14" fill="#92400e">c</text>

  <text x="60" y="308" font-size="12.5" fill="#4b5563">邊 a 對著角 A，邊 b 對著角 B，邊 c 對著角 C</text>

  <!-- 右側說明 -->
  <text x="352" y="74" font-size="15" font-weight="bold" fill="#0e7490">正弦定理</text>
  <text x="352" y="106" font-size="14" fill="#1f2937">a ÷ sin A = b ÷ sin B</text>
  <text x="378" y="130" font-size="14" fill="#1f2937">= c ÷ sin C = 2R</text>

  <text x="352" y="166" font-size="13" font-weight="bold" fill="#b45309">什麼時候用</text>
  <text x="352" y="192" font-size="12.5" fill="#1f2937">• 兩角一邊（AAS / ASA）</text>
  <text x="352" y="214" font-size="12.5" fill="#1f2937">• 兩邊一對角（SSA）可能兩解</text>
  <text x="352" y="236" font-size="12.5" fill="#1f2937">• 求外接圓半徑 R</text>

  <text x="352" y="272" font-size="12.5" fill="#4b5563">R = abc ÷ 4K　（K 為面積）</text>
  <text x="352" y="296" font-size="12.5" fill="#4b5563">2R 就是過圓心的最長弦（直徑）</text>
</svg>
