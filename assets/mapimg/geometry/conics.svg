<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="280" y="42" font-size="15" font-weight="bold" fill="#0e7490" text-anchor="middle">圓錐曲線：先用「定義」認出是哪一種（選修）</text>

  <!-- ① 拋物線 -->
  <line x1="40" y1="78" x2="40" y2="232" stroke="#9ca3af" stroke-width="1.8"/>
  <text x="22" y="248" font-size="12" fill="#6b7280">準線</text>
  <polyline fill="none" stroke="#0891b2" stroke-width="2.2" points="124.8,83 114.5,89 105,95 96.5,101 88.8,107 82.1,113 76.2,119 71.3,125 67.2,131 64.1,137 61.8,143 60.5,149 60,155 60.5,161 61.8,167 64.1,173 67.2,179 71.3,185 76.2,191 82.1,197 88.8,203 96.5,209 105,215 114.5,221 124.8,227"/>
  <circle cx="80" cy="155" r="4" fill="#d97706"/>
  <text x="84" y="170" font-size="12" fill="#b45309">F</text>
  <circle cx="88.8" cy="107" r="4" fill="#7c3aed"/>
  <text x="97" y="92" font-size="12" fill="#6d28d9">P</text>
  <line x1="88.8" y1="107" x2="80" y2="155" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="88.8" y1="107" x2="40" y2="107" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="46" y="100" font-size="11" fill="#6d28d9">相等</text>

  <!-- ② 橢圓 -->
  <ellipse cx="265" cy="155" rx="68" ry="45" fill="none" stroke="#0891b2" stroke-width="2.2"/>
  <circle cx="214" cy="155" r="4" fill="#d97706"/>
  <circle cx="316" cy="155" r="4" fill="#d97706"/>
  <text x="204" y="172" font-size="12" fill="#b45309">F₁</text>
  <text x="312" y="172" font-size="12" fill="#b45309">F₂</text>
  <circle cx="231" cy="116" r="4" fill="#7c3aed"/>
  <text x="222" y="108" font-size="12" fill="#6d28d9">P</text>
  <line x1="231" y1="116" x2="214" y2="155" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="231" y1="116" x2="316" y2="155" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- ③ 雙曲線 -->
  <line x1="405" y1="77.3" x2="495" y2="232.7" stroke="#e5e7eb" stroke-width="1.4"/>
  <line x1="405" y1="232.7" x2="495" y2="77.3" stroke="#e5e7eb" stroke-width="1.4"/>
  <polyline fill="none" stroke="#0891b2" stroke-width="2.2" points="501.8,74.1 497.3,82.6 493.4,90.5 489.8,97.6 486.7,104.2 483.9,110.3 481.5,116 479.4,121.3 477.6,126.2 476.1,130.8 474.8,135.2 473.8,139.4 473,143.4 472.4,147.3 472.1,151.2 472,155 472.1,158.8 472.4,162.7 473,166.6 473.8,170.6 474.8,174.8 476.1,179.2 477.6,183.8 479.4,188.7 481.5,194 483.9,199.7 486.7,205.8 489.8,212.4 493.4,219.5 497.3,227.4"/>
  <polyline fill="none" stroke="#0891b2" stroke-width="2.2" points="398.2,74.1 402.7,82.6 406.6,90.5 410.2,97.6 413.3,104.2 416.1,110.3 418.5,116 420.6,121.3 422.4,126.2 423.9,130.8 425.2,135.2 426.2,139.4 427,143.4 427.6,147.3 427.9,151.2 428,155 427.9,158.8 427.6,162.7 427,166.6 426.2,170.6 425.2,174.8 423.9,179.2 422.4,183.8 420.6,188.7 418.5,194 416.1,199.7 413.3,205.8 410.2,212.4 406.6,219.5 402.7,227.4"/>
  <circle cx="406.1" cy="155" r="4" fill="#d97706"/>
  <circle cx="493.9" cy="155" r="4" fill="#d97706"/>
  <text x="396" y="172" font-size="12" fill="#b45309">F₁</text>
  <text x="496" y="172" font-size="12" fill="#b45309">F₂</text>
  <circle cx="479.4" cy="188.7" r="4" fill="#7c3aed"/>
  <text x="484" y="200" font-size="12" fill="#6d28d9">P</text>
  <line x1="479.4" y1="188.7" x2="406.1" y2="155" stroke="#7c3aed" stroke-width="1.4"/>
  <line x1="479.4" y1="188.7" x2="493.9" y2="155" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="434" y="245" font-size="11" fill="#9ca3af">漸近線</text>

  <!-- 文字列 -->
  <text x="92" y="268" font-size="13.5" fill="#1f2937" text-anchor="middle">拋物線</text>
  <text x="265" y="268" font-size="13.5" fill="#1f2937" text-anchor="middle">橢圓</text>
  <text x="450" y="268" font-size="13.5" fill="#1f2937" text-anchor="middle">雙曲線</text>

  <text x="92" y="290" font-size="11.5" fill="#4b5563" text-anchor="middle">到定點與定直線等距</text>
  <text x="265" y="290" font-size="11.5" fill="#4b5563" text-anchor="middle">到兩定點的距離「和」= 2a</text>
  <text x="450" y="290" font-size="11.5" fill="#4b5563" text-anchor="middle">到兩定點的距離「差」= 2a</text>

  <text x="92" y="311" font-size="11.5" fill="#0e7490" text-anchor="middle">y² = 4cx，正焦弦 4|c|</text>
  <text x="265" y="311" font-size="11.5" fill="#0e7490" text-anchor="middle">c² = a² − b²（a 最大）</text>
  <text x="450" y="311" font-size="11.5" fill="#0e7490" text-anchor="middle">c² = a² + b²（c 最大）</text>

  <text x="280" y="332" font-size="11.5" fill="#4b5563" text-anchor="middle">離心率 e = c ÷ a：橢圓 0 &lt; e &lt; 1、拋物線 e = 1、雙曲線 e &gt; 1；漸近線 y = ±(b ÷ a)x</text>
</svg>
