<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Hiragino Sans',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <circle cx="180" cy="180" r="95" fill="none" stroke="#0891b2" stroke-width="2"/>

  <!-- 弧 AB（下方）加粗 -->
  <path d="M 90.7 212.5 A 95 95 0 0 0 269.3 212.5" fill="none" stroke="#d97706" stroke-width="4"/>

  <!-- 圓心角 -->
  <line x1="180" y1="180" x2="90.7" y2="212.5" stroke="#0891b2" stroke-width="2"/>
  <line x1="180" y1="180" x2="269.3" y2="212.5" stroke="#0891b2" stroke-width="2"/>
  <path d="M 149.9 190.9 A 32 32 0 0 0 210.1 190.9" fill="none" stroke="#0891b2" stroke-width="1.6"/>
  <text x="161" y="240" font-size="13" fill="#0e7490">140°</text>
  <circle cx="180" cy="180" r="3.5" fill="#0891b2"/>
  <text x="186" y="176" font-size="13" fill="#0e7490">O</text>

  <!-- 圓周角 P -->
  <line x1="196.5" y1="86.4" x2="90.7" y2="212.5" stroke="#7c3aed" stroke-width="2"/>
  <line x1="196.5" y1="86.4" x2="269.3" y2="212.5" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 174.6 112.4 A 34 34 0 0 0 213.5 115.8" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="182" y="136" font-size="13" fill="#6d28d9">70°</text>
  <circle cx="196.5" cy="86.4" r="4.5" fill="#7c3aed"/>
  <text x="202" y="80" font-size="13" fill="#6d28d9">P</text>

  <!-- 另一個圓周角 P₂ -->
  <line x1="118.9" y1="107.2" x2="90.7" y2="212.5" stroke="#c4b5fd" stroke-width="1.6" stroke-dasharray="4 3"/>
  <line x1="118.9" y1="107.2" x2="269.3" y2="212.5" stroke="#c4b5fd" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M 111.1 136.2 A 30 30 0 0 0 143.5 124.4" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="126" y="156" font-size="12" fill="#8b5cf6">70°</text>
  <circle cx="118.9" cy="107.2" r="4" fill="#a78bfa"/>
  <text x="98" y="100" font-size="12" fill="#8b5cf6">P′</text>

  <circle cx="90.7" cy="212.5" r="4.5" fill="#d97706"/>
  <circle cx="269.3" cy="212.5" r="4.5" fill="#d97706"/>
  <text x="72" y="228" font-size="13" fill="#b45309">A</text>
  <text x="276" y="228" font-size="13" fill="#b45309">B</text>

  <text x="46" y="316" font-size="12" fill="#4b5563">圓周角的頂點在圓上，圓心角的頂點在圓心</text>

  <!-- 右側 -->
  <text x="336" y="78" font-size="15" font-weight="bold" fill="#0e7490">圓周角＝圓心角的一半</text>
  <text x="336" y="110" font-size="13.5" fill="#1f2937">∠APB = ∠AOB ÷ 2</text>
  <text x="336" y="134" font-size="12" fill="#4b5563">（對著同一段弧 AB）</text>

  <text x="336" y="170" font-size="12.5" fill="#1f2937">同弧（或等弧）的圓周角都相等</text>
  <text x="336" y="196" font-size="12.5" fill="#1f2937">直徑所對的圓周角 = 90°</text>
  <text x="352" y="218" font-size="12" fill="#4b5563">（半圓的圓周角）</text>

  <text x="336" y="254" font-size="13" font-weight="bold" fill="#b45309">常用在</text>
  <text x="336" y="278" font-size="12" fill="#1f2937">• 找相等的角 → 相似三角形</text>
  <text x="336" y="300" font-size="12" fill="#1f2937">• 看到 90° 就想到直徑</text>
  <text x="336" y="324" font-size="11.5" fill="#4b5563">國中舊識，不是高中的新公式</text>
</svg>
