<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="280" y="44" font-size="15" font-weight="bold" fill="#0e7490" text-anchor="middle">圓與直線：比「圓心到直線的距離 d」與「半徑 r」</text>

  <!-- 相離 -->
  <circle cx="110" cy="150" r="55" fill="none" stroke="#0891b2" stroke-width="2.2"/>
  <circle cx="110" cy="150" r="3.5" fill="#0891b2"/>
  <line x1="30" y1="230" x2="190" y2="230" stroke="#d97706" stroke-width="2.2"/>
  <line x1="110" y1="150" x2="110" y2="230" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="116" y="196" font-size="12" fill="#6d28d9">d</text>
  <line x1="110" y1="150" x2="165" y2="150" stroke="#0891b2" stroke-width="1.6"/>
  <text x="132" y="144" font-size="12" fill="#0e7490">r</text>

  <!-- 相切 -->
  <circle cx="280" cy="150" r="55" fill="none" stroke="#0891b2" stroke-width="2.2"/>
  <circle cx="280" cy="150" r="3.5" fill="#0891b2"/>
  <line x1="200" y1="205" x2="360" y2="205" stroke="#d97706" stroke-width="2.2"/>
  <line x1="280" y1="150" x2="280" y2="205" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="286" y="184" font-size="12" fill="#6d28d9">d</text>
  <circle cx="280" cy="205" r="4.5" fill="#d97706"/>
  <text x="288" y="222" font-size="11.5" fill="#b45309">切點</text>

  <!-- 相交 -->
  <circle cx="450" cy="150" r="55" fill="none" stroke="#0891b2" stroke-width="2.2"/>
  <circle cx="450" cy="150" r="3.5" fill="#0891b2"/>
  <line x1="370" y1="180" x2="530" y2="180" stroke="#d97706" stroke-width="2.2"/>
  <line x1="450" y1="150" x2="450" y2="180" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="456" y="170" font-size="12" fill="#6d28d9">d</text>
  <circle cx="403.9" cy="180" r="4.5" fill="#d97706"/>
  <circle cx="496.1" cy="180" r="4.5" fill="#d97706"/>
  <text x="450" y="200" font-size="11.5" fill="#b45309" text-anchor="middle">弦</text>

  <!-- 標題列 -->
  <text x="110" y="268" font-size="14" fill="#1f2937" text-anchor="middle">d &gt; r　相離</text>
  <text x="280" y="268" font-size="14" fill="#1f2937" text-anchor="middle">d = r　相切</text>
  <text x="450" y="268" font-size="14" fill="#1f2937" text-anchor="middle">d &lt; r　相交</text>
  <text x="110" y="292" font-size="12" fill="#4b5563" text-anchor="middle">沒有交點</text>
  <text x="280" y="292" font-size="12" fill="#4b5563" text-anchor="middle">1 個交點</text>
  <text x="450" y="292" font-size="12" fill="#4b5563" text-anchor="middle">2 個交點</text>

  <text x="280" y="324" font-size="12" fill="#4b5563" text-anchor="middle">也可以聯立看判別式（兩法等價），但求切線時「距離＝半徑」快得多；弦長 = 2√(r² − d²)</text>
</svg>
