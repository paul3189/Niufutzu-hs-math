<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="40" y="46" font-size="15" font-weight="bold" fill="#0e7490">歪斜：不共面，所以不相交也不平行</text>

  <!-- 長方體：前面 A B C D，後面 E F G H -->
  <!-- 被擋住的邊（通過 E） -->
  <line x1="60" y1="250" x2="112" y2="210" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="112" y1="210" x2="262" y2="210" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="112" y1="210" x2="112" y2="105" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- 前面 -->
  <polyline points="60,250 210,250 210,145 60,145 60,250" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <!-- 上面與右面 -->
  <line x1="60" y1="145" x2="112" y2="105" stroke="#6b7280" stroke-width="1.8"/>
  <line x1="210" y1="145" x2="262" y2="105" stroke="#6b7280" stroke-width="1.8"/>
  <line x1="210" y1="250" x2="262" y2="210" stroke="#6b7280" stroke-width="1.8"/>
  <line x1="112" y1="105" x2="262" y2="105" stroke="#6b7280" stroke-width="1.8"/>
  <line x1="262" y1="105" x2="262" y2="210" stroke="#6b7280" stroke-width="1.8"/>

  <!-- 兩條歪斜線 -->
  <line x1="60" y1="250" x2="210" y2="250" stroke="#0891b2" stroke-width="4"/>
  <line x1="262" y1="210" x2="262" y2="105" stroke="#d97706" stroke-width="4"/>

  <!-- 頂點 -->
  <text x="48" y="268" font-size="12" fill="#374151">A</text>
  <text x="212" y="268" font-size="12" fill="#374151">B</text>
  <text x="214" y="142" font-size="12" fill="#374151">C</text>
  <text x="46" y="142" font-size="12" fill="#374151">D</text>
  <text x="98" y="226" font-size="12" fill="#9ca3af">E</text>
  <text x="266" y="226" font-size="12" fill="#374151">F</text>
  <text x="266" y="102" font-size="12" fill="#374151">G</text>
  <text x="100" y="100" font-size="12" fill="#374151">H</text>

  <text x="118" y="288" font-size="12.5" fill="#0e7490">AB</text>
  <text x="272" y="162" font-size="12.5" fill="#b45309">FG</text>
  <text x="40" y="314" font-size="12.5" fill="#1f2937">AB 與 FG：不相交、也不平行 ⇒ 歪斜</text>

  <!-- 右側 -->
  <text x="300" y="76" font-size="14" font-weight="bold" fill="#0e7490">空間中兩直線的三種關係</text>
  <text x="300" y="106" font-size="12.5" fill="#1f2937">相交：共面，恰一個交點</text>
  <text x="300" y="132" font-size="12.5" fill="#1f2937">平行：共面，沒有交點</text>
  <text x="300" y="158" font-size="12.5" fill="#b45309">歪斜：不共面，也沒有交點</text>

  <text x="300" y="194" font-size="13" font-weight="bold" fill="#0e7490">怎麼判斷</text>
  <text x="300" y="220" font-size="12.5" fill="#1f2937">先看方向向量平行嗎？</text>
  <text x="316" y="242" font-size="12" fill="#4b5563">平行 → 平行（或重合）</text>
  <text x="300" y="268" font-size="12.5" fill="#1f2937">不平行 → 把兩參數式聯立</text>
  <text x="316" y="290" font-size="12" fill="#4b5563">解得出 → 相交</text>
  <text x="316" y="312" font-size="12" fill="#4b5563">解不出 → 歪斜</text>
</svg>
