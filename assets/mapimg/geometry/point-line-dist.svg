<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" font-family="'Noto Sans TC','Microsoft JhengHei','Segoe UI',sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>

  <text x="45" y="48" font-size="15" font-weight="bold" fill="#0e7490">點到直線的距離＝垂直的那一段</text>

  <!-- 直線 -->
  <line x1="60" y1="250" x2="430" y2="98" stroke="#0891b2" stroke-width="2.4"/>
  <text x="286" y="142" font-size="13" fill="#0e7490" transform="rotate(-22.3 286 142)">ℓ : ax + by + c = 0</text>

  <!-- 點 P 與垂足 -->
  <circle cx="150" cy="110" r="5" fill="#d97706"/>
  <text x="96" y="102" font-size="13" fill="#b45309">P(x₀, y₀)</text>
  <line x1="150" y1="110" x2="186.2" y2="198.2" stroke="#d97706" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="186.2" cy="198.2" r="4" fill="#0891b2"/>
  <text x="196" y="216" font-size="12" fill="#0e7490">垂足</text>
  <text x="136" y="160" font-size="15" fill="#b45309">d</text>
  <polyline points="196.4,193.8 192.2,183.6 182.0,187.8" fill="none" stroke="#0891b2" stroke-width="1.4"/>

  <!-- 其他連線示意：斜的都比較長 -->
  <line x1="150" y1="110" x2="260" y2="205.9" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="150" y1="110" x2="110" y2="229.4" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="252" y="232" font-size="11.5" fill="#9ca3af">斜的都比 d 長</text>

  <!-- 公式 -->
  <text x="45" y="294" font-size="16" fill="#1f2937">d = |a x₀ + b y₀ + c| ÷ √(a² + b²)</text>
  <text x="45" y="320" font-size="12.5" fill="#4b5563">直線要先化成一般式、等號右邊是 0；分母只看 x、y 的係數</text>

  <!-- 右側 -->
  <text x="400" y="160" font-size="13" font-weight="bold" fill="#b45309">同一條公式還能算</text>
  <text x="400" y="186" font-size="12" fill="#1f2937">• 三角形的高</text>
  <text x="400" y="208" font-size="12" fill="#1f2937">• 圓心到直線 → 判斷相切</text>
  <text x="400" y="230" font-size="12" fill="#1f2937">• 兩平行線的距離：</text>
  <text x="412" y="252" font-size="12" fill="#0e7490">|c₁ − c₂| ÷ √(a² + b²)</text>
  <text x="412" y="272" font-size="11.5" fill="#4b5563">（a、b 要先化成一樣）</text>
</svg>
